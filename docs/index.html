<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#26372f">
    <title>Antiochian Chant Stand</title>
    <link rel="stylesheet" href="./css/site.css?v=ac9ca7e1eb1b">
  </head>
  <body class="notes-mode">
    <header class="controls" aria-label="Music navigation">
      <div class="top-row">
        <button id="actionsButton" class="header-action actions-button" type="button" aria-label="More options" title="More options">
          <svg class="view-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="12" r="1.25" />
            <circle cx="12" cy="12" r="1.25" />
            <circle cx="19" cy="12" r="1.25" />
          </svg>
        </button>
        <details id="schedule" class="schedule">
          <summary>
            <span id="scheduleLabel" class="schedule-label"><span id="scheduleDay">Loading…</span><span class="schedule-separator" aria-hidden="true"> · </span><span id="scheduleService">service…</span></span>
            <svg class="disclosure" viewBox="0 0 16 16" aria-hidden="true">
              <path d="m3 6 5 5 5-5" />
            </svg>
          </summary>
          <div class="schedule-controls">
            <div class="nav-row date-row">
              <button id="previousDay" class="arrow" type="button" aria-label="Previous day">‹</button>
              <label class="center-label date-picker">
                <span id="dateLabel">Loading…</span>
                <select id="dateSelect" aria-label="Choose service date"></select>
              </label>
              <button id="nextDay" class="arrow" type="button" aria-label="Next day">›</button>
            </div>

            <div class="nav-row service-row">
              <button id="previousService" class="arrow" type="button" aria-label="Previous service">‹</button>
              <div id="serviceTabs" class="service-tabs" role="tablist" aria-label="Services"></div>
              <button id="nextService" class="arrow" type="button" aria-label="Next service">›</button>
            </div>
          </div>
        </details>
        <button id="viewToggle" class="header-action view-toggle" type="button" aria-label="Return to music" title="Return to music">
          <svg id="notesIcon" class="view-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M6 3h9l3 3v15H6z" />
            <path d="M15 3v4h4M9 11h6M9 15h6" />
          </svg>
          <svg id="musicIcon" class="view-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V6l9-2v12" />
            <ellipse cx="6.5" cy="18" rx="2.5" ry="2" />
            <ellipse cx="15.5" cy="16" rx="2.5" ry="2" />
          </svg>
        </button>
      </div>

      <div class="music-row">
        <button id="previousMusic" class="arrow" type="button" aria-label="Previous music">‹</button>
        <div class="music-picker">
          <label class="visually-hidden" for="musicSelect">Music</label>
          <select id="musicSelect" aria-label="Choose music"></select>
          <span class="music-meta">
            <small id="musicPosition"></small>
            <button id="settingButton" class="setting-trigger" type="button" hidden></button>
            <button id="pdfCopyButton" class="pdf-copy-trigger" type="button" hidden></button>
          </span>
        </div>
        <button id="nextMusic" class="arrow" type="button" aria-label="Next music">›</button>
      </div>
    </header>

    <dialog id="actionsDialog" class="settings-dialog actions-dialog" aria-labelledby="actionsTitle">
      <div class="dialog-heading">
        <strong id="actionsTitle">Options</strong>
        <button id="closeActions" class="dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="actions-content">
        <a id="downloadPdf" class="download-action" href="#" download>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m-5-5 5 5 5-5M5 20h14" />
          </svg>
          <span>
            <strong>Download current PDF</strong>
            <small id="downloadDescription">Save the service notes</small>
          </span>
        </a>
        <div class="actions-divider" role="presentation"></div>
        <label class="preference-row" for="showBilingualServices">
          <span>
            <strong>Show bilingual services</strong>
            <small>Include bilingual editions in the service list</small>
          </span>
          <span class="switch-control">
            <input id="showBilingualServices" type="checkbox">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </div>
    </dialog>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="dialog-heading">
        <strong id="settingsTitle">Choose setting</strong>
        <button id="closeSettings" class="dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="settings" class="setting-list"></div>
    </dialog>

    <dialog id="pdfFallbackDialog" class="settings-dialog pdf-fallback-dialog" aria-labelledby="pdfFallbackTitle">
      <div class="dialog-heading">
        <strong id="pdfFallbackTitle">PDF not displaying correctly?</strong>
        <button id="closePdfFallback" class="dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="pdf-fallback-content">
        <p id="pdfFallbackDescription"></p>
        <div class="pdf-fallback-actions">
          <button id="keepPdfCopy" class="setting pdf-fallback-keep" type="button">Keep faster version</button>
          <button id="switchPdfCopy" class="setting pdf-fallback-switch" type="button">Open original</button>
        </div>
      </div>
    </dialog>

    <main id="viewer" class="viewer" aria-live="polite">
      <p id="message" class="message">Loading notes…</p>
      <div id="musicPages" class="pages" hidden></div>
      <div id="notesPages" class="pages"></div>
    </main>

    <script type="module" src="./js/app.js?v=4392313ba3e7"></script>
  </body>
</html>
